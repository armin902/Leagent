<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Leagent</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/extra.css"></head><body class="auth-body"><header id="navMount"></header><main class="auth-layout"><section class="auth-aside"><span class="eyebrow">WELCOME BACK</span><h1>Your housing<br><em>journey starts here.</em></h1><p>Understand the terms. Plan the move. Find your people.</p><div class="auth-aside-note">✦ Built for Penn State students</div></section><section class="auth-card"><span class="eyebrow">LEAGENT ACCOUNT</span><h2>Log in</h2><p>Welcome back. Pick up where you left off.</p><form id="authForm"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"><p class="form-error" id="formError" role="alert"></p><button class="button primary full" type="submit">Log in →</button></form><div class="auth-divider">or continue with</div><div id="googleButton" class="google-mount"></div><p id="googleNote" class="google-note"></p><p class="auth-switch">New to Leagent? <a href="/signup">Create an account</a></p></section></main><script type="module" src="/nav.js"></script><script type="module" src="/auth-client.js"></script></body></html>
