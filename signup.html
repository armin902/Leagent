<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Leagent</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/extra.css"></head><body class="auth-body"><header id="navMount"></header><main class="auth-layout"><section class="auth-aside"><span class="eyebrow">JOIN LEAGENT</span><h1>Make your next<br><em>move clearer.</em></h1><p>One account for your lease review, move-in planning, and future housing tools.</p><div class="auth-aside-note">✦ Built for Penn State students</div></section><section class="auth-card"><span class="eyebrow">LEAGENT ACCOUNT</span><h2>Create account</h2><p>Get started in less than a minute.</p><form id="authForm"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" minlength="2" required placeholder="Your name"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required placeholder="At least 10 characters"><p class="form-error" id="formError" role="alert"></p><button class="button primary full" type="submit">Create account →</button></form><div class="auth-divider">or continue with</div><div id="googleButton" class="google-mount"></div><p id="googleNote" class="google-note"></p><p class="auth-switch">Already have an account? <a href="/login">Log in</a></p></section></main><script type="module" src="/nav.js"></script><script type="module" src="/auth-client.js"></script></body></html>
